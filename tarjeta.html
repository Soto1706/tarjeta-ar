<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjeta de Presentación Inmersiva 9x5 cm</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="print-body">

  <!-- FRENTE DE LA TARJETA (9x5 cm) -->
  <div class="card front minimalist">
    <div class="header-minimal">
      <div class="badge-tech">EXPERIENCIA XR</div>
      <p class="scan-instruction">ESCANEA EL CÓDIGO QR</p>
    </div>
    
    <!-- CÓDIGO QR GIGANTE -->
    <div class="qr-zone-large">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://Soto1706.github.io/tarjeta-ar/" alt="Código QR AR">
    </div>

    <!-- MARCADOR HIRO INTEGRADO -->
    <div class="hiro-container-card">
      <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Marcador Hiro" class="hiro-img">
      <span class="hiro-label">Marcador AR</span>
    </div>
  </div>

  <!-- VUELTA DE LA TARJETA (9x5 cm) -->
  <div class="card back">
    <div class="back-content">
      <div class="badge">REALIDAD AUMENTADA</div>
      <h3>Tarjeta de Presentación Inmersiva</h3>
      <p>Apunte la cámara hacia el marcador de la tarjeta para desplegar el perfil e información de contacto en 3D.</p>
      <div class="tech-stack">
        <span>Ing. Computación</span> • <span>WebAR</span> • <span>A-Frame</span>
      </div>
      <div class="footer-link">github.com/Soto1706/tarjeta-ar</div>
    </div>
  </div>

</body>
</html>
