<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Realidad Aumentada - Tarjeta</title>
  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Librería AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Indicador en pantalla para el usuario -->
  <div id="ar-ui">
    <p>Apunta tu cámara al <strong>Marcador Hiro</strong> de la tarjeta</p>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Recurso de la foto de perfil -->
    <a-assets>
      <img id="user-photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300">
    </a-assets>

    <!-- Detección del Marcador Hiro -->
    <a-marker preset="hiro" id="hiro-marker">
      
      <!-- Panel de Fondo Tecnológico (Negro/Azul) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="3.2" height="2" color="#0F172A" material="opacity: 0.95; transparent: true;"></a-plane>
      
      <!-- Borde Verde Neón -->
      <a-ring position="0 0 0.01" rotation="-90 0 0" radius-inner="1.55" radius-outer="1.6" color="#00E676"></a-ring>

      <!-- Foto de Perfil 3D -->
      <a-image src="#user-photo" position="-1 0 0.1" rotation="-90 0 0" width="0.8" height="0.8"></a-image>

      <!-- Información en texto 3D -->
      <a-text value="Tu Nombre y Apellido" position="-0.4 0 0.3" rotation="-90 0 0" color="#00E676" width="4.5"></a-text>
      <a-text value="Futuro Ing. Informatico" position="-0.4 0 0.1" rotation="-90 0 0" color="#FFFFFF" width="3.2"></a-text>
      
      <a-text value="Tel: +52 55 1234 5678" position="-0.4 0 -0.1" rotation="-90 0 0" color="#94A3B8" width="2.5"></a-text>
      <a-text value="Email: tu.correo@email.com" position="-0.4 0 -0.25" rotation="-90 0 0" color="#94A3B8" width="2.5"></a-text>
      <a-text value="LinkedIn: /in/tu-perfil" position="-0.4 0 -0.4" rotation="-90 0 0" color="#38BDF8" width="2.5"></a-text>

      <!-- Botón interactivo 3D -->
      <a-box id="btn-portfolio" position="0 0 0.6" rotation="-90 0 0" width="1.8" height="0.35" depth="0.05" color="#0066FF">
        <a-text value="Ver Portafolio" align="center" position="0 0 0.04" color="#FFFFFF" width="2.5"></a-text>
      </a-box>

    </a-marker>

    <!-- Cámara virtual para el renderizado AR -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
