<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Realidad Aumentada - Edgar Gabriel Soto Herrera</title>
  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Librería AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Mensaje de instrucciones en la parte inferior -->
  <div id="ar-ui">
    <p>Apunta la cámara al <strong>Marcador Hiro</strong></p>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene 
    embedded 
    renderer="logarithmicDepthBuffer: true; antialias: true; precision: high;"
    arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
    
    <!-- TU FOTO PERSONAL SUBIDA A GITHUB -->
    <a-assets>
      <img id="user-photo" src="foto.jpg">
    </a-assets>

    <!-- Detección del Marcador Hiro con filtro de suavizado para evitar inclinaciones -->
    <a-marker 
      preset="hiro" 
      id="hiro-marker" 
      smooth="true" 
      smoothCount="10" 
      smoothTolerance="0.01" 
      smoothThreshold="5">
      
      <!-- CONTENEDOR PRINCIPAL CON ESCALA (1.4x) -->
      <a-entity position="0 0.1 0" scale="1.4 1.4 1.4">
        
        <!-- BASE EXTERIOR VERDE NEÓN (Y = 0) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="4.1" height="2.5" color="#00E676" material="shader: flat; opacity: 1.0; transparent: false;"></a-plane>

        <!-- FONDO OSCURO SÓLIDO (Y = 0.08) -->
        <a-plane position="0 0.08 0" rotation="-90 0 0" width="3.98" height="2.38" color="#0F172A" material="shader: flat; opacity: 1.0; transparent: false;"></a-plane>

        <!-- FOTO DE PERFIL (Y = 0.18) -->
        <a-image src="#user-photo" position="-1.2 0.18 0" rotation="-90 0 0" width="1.1" height="1.1"></a-image>

        <!-- NOMBRE PRINCIPAL (Y = 0.18) -->
        <a-text value="Edgar Gabriel Soto Herrera" position="-0.4 0.18 -0.75" rotation="-90 0 0" color="#00E676" width="5.0"></a-text>

        <!-- CARRERA (Y = 0.18) -->
        <a-text value="Ing. en Computacion" position="-0.4 0.18 -0.45" rotation="-90 0 0" color="#FFFFFF" width="4.0"></a-text>

        <!-- LÍNEA DECORATIVA (Y = 0.18) -->
        <a-plane position="0.55 0.18 -0.25" rotation="-90 0 0" width="2.0" height="0.02" color="#00E676" material="shader: flat;"></a-plane>

        <!-- DATOS DE CONTACTO (Y = 0.18) -->
        <a-text value="Tel: +52 492 290 8618" position="-0.4 0.18 -0.05" rotation="-90 0 0" color="#E2E8F0" width="3.2"></a-text>
        <a-text value="Email: gabrielsohe05@gmail.com" position="-0.4 0.18 0.2" rotation="-90 0 0" color="#E2E8F0" width="2.9"></a-text>
        <a-text value="GitHub: github.com/Soto1706" position="-0.4 0.18 0.45" rotation="-90 0 0" color="#38BDF8" width="2.9"></a-text>

        <!-- BOTÓN INTERACTIVO (Y = 0.28) -->
        <a-box id="btn-portfolio" position="0 0.28 0.85" rotation="-90 0 0" width="2.3" height="0.38" depth="0.04" color="#0066FF">
          <a-text value="VER PORTAFOLIO" align="center" position="0 0 0.03" color="#FFFFFF" width="3.2"></a-text>
        </a-box>

      </a-entity>

    </a-marker>

    <!-- Cámara virtual -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
