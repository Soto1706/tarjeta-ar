<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Realidad Aumentada - Edgar Gabriel Soto Herrera</title>
  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Librería AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Indicador en pantalla para el usuario -->
  <div id="ar-ui">
    <p>Apunta la cámara al <strong>Marcador Hiro</strong></p>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
    
    <!-- Recurso de la foto de perfil -->
    <a-assets>
      <img id="user-photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300">
    </a-assets>

    <!-- Detección del Marcador Hiro -->
    <a-marker preset="hiro" id="hiro-marker">
      
      <!-- Panel de Fondo Tecnológico (Negro/Azul) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="3.6" height="2.2" color="#0F172A" material="opacity: 0.95; transparent: true;"></a-plane>
      
      <!-- Borde Verde Neón -->
      <a-ring position="0 0 0.01" rotation="-90 0 0" radius-inner="1.75" radius-outer="1.8" color="#00E676"></a-ring>

      <!-- Foto de Perfil 3D -->
      <a-image src="#user-photo" position="-1.1 0 0.1" rotation="-90 0 0" width="0.9" height="0.9"></a-image>

      <!-- DATOS PERSONALES EN TEXTO 3D -->
      <a-text value="Edgar Gabriel Soto Herrera" position="-0.4 0 0.4" rotation="-90 0 0" color="#00E676" width="4.2"></a-text>
      <a-text value="Ing. Computacion" position="-0.4 0 0.15" rotation="-90 0 0" color="#FFFFFF" width="3.5"></a-text>
      
      <a-text value="Tel: +52 492 290 8618" position="-0.4 0 -0.1" rotation="-90 0 0" color="#94A3B8" width="2.8"></a-text>
      <a-text value="Email: gabrielsohe05@gmail.com" position="-0.4 0 -0.3" rotation="-90 0 0" color="#94A3B8" width="2.6"></a-text>
      <a-text value="GitHub: github.com/Soto1706" position="-0.4 0 -0.5" rotation="-90 0 0" color="#38BDF8" width="2.6"></a-text>

      <!-- Botón interactivo 3D -->
      <a-box id="btn-portfolio" position="0 0 0.75" rotation="-90 0 0" width="2.0" height="0.35" depth="0.05" color="#0066FF">
        <a-text value="Ver Portafolio" align="center" position="0 0 0.04" color="#FFFFFF" width="2.5"></a-text>
      </a-box>

    </a-marker>

    <!-- Cámara virtual -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
