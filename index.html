<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Realidad Aumentada - Edgar Gabriel Soto Herrera</title>
  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Librería AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Mensaje de instrucciones movido a la parte inferior para no tapar los datos -->
  <div id="ar-ui">
    <p>Apunta la cámara al <strong>Marcador Hiro</strong></p>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
    
    <!-- Recurso de la foto de perfil -->
    <a-assets>
      <img id="user-photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300">
    </a-assets>

    <!-- Detección del Marcador Hiro -->
    <a-marker preset="hiro" id="hiro-marker">
      
      <!-- CONTENEDOR PRINCIPAL CON ESCALA AUMENTADA (1.4x) Y ELEVADO EN Z -->
      <a-entity position="0 0.1 0" scale="1.4 1.4 1.4">
        
        <!-- Borde Exterior Verde Neón -->
        <a-plane position="0 0 -0.01" rotation="-90 0 0" width="4.1" height="2.5" color="#00E676" material="shader: flat;"></a-plane>

        <!-- Fondo Oscuro de la Tarjeta 3D -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="4.0" height="2.4" color="#0F172A" material="opacity: 0.98; transparent: true; shader: flat;"></a-plane>

        <!-- Foto de Perfil (Izquierda) -->
        <a-image src="#user-photo" position="-1.25 0.03 0" rotation="-90 0 0" width="1.1" height="1.1"></a-image>

        <!-- Nombre Principal -->
        <a-text value="Edgar Gabriel Soto Herrera" position="-0.45 0.03 -0.75" rotation="-90 0 0" color="#00E676" width="5.0"></a-text>

        <!-- Carrera / Profesión -->
        <a-text value="Ing. en Computacion" position="-0.45 0.03 -0.45" rotation="-90 0 0" color="#FFFFFF" width="4.0"></a-text>

        <!-- Línea Decorativa -->
        <a-plane position="0.5 0.03 -0.25" rotation="-90 0 0" width="2.1" height="0.02" color="#00E676" material="shader: flat;"></a-plane>

        <!-- Teléfono -->
        <a-text value="Tel: +52 492 290 8618" position="-0.45 0.03 -0.05" rotation="-90 0 0" color="#E2E8F0" width="3.2"></a-text>

        <!-- Correo -->
        <a-text value="Email: gabrielsohe05@gmail.com" position="-0.45 0.03 0.2" rotation="-90 0 0" color="#E2E8F0" width="2.9"></a-text>

        <!-- GitHub -->
        <a-text value="GitHub: github.com/Soto1706" position="-0.45 0.03 0.45" rotation="-90 0 0" color="#38BDF8" width="2.9"></a-text>

        <!-- Botón Interactivo 3D -->
        <a-box id="btn-portfolio" position="0 0.06 0.85" rotation="-90 0 0" width="2.3" height="0.38" depth="0.06" color="#0066FF">
          <a-text value="VER PORTAFOLIO" align="center" position="0 0 0.04" color="#FFFFFF" width="3.2"></a-text>
        </a-box>

      </a-entity>

    </a-marker>

    <!-- Cámara virtual -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
